name: Server CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/src/server.rs'
      - 'backend/src/server/**'
      - 'backend/src/*.rs'
      - 'backend/*'
      - 'backend/migrations/**'
      - 'backend/scripts/lint-migrations.sh'
      - '.squawk.toml'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'backend/src/server.rs'
      - 'backend/src/server/**'
      - 'backend/src/*.rs'
      - 'backend/*'
      - 'backend/migrations/**'
      - 'backend/scripts/lint-migrations.sh'
      - '.squawk.toml'
      - '.github/workflows/server-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: ./backend

jobs:
  test:
    name: server-lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      # `--all-features` turns on `embed-ui`, whose `#[derive(Embed)]` reads `ui/build` at compile
      # time. That directory is a UI build artefact, gitignored and never built by this job, and a
      # missing folder makes the derive emit no impl at all — so the module fails to compile with
      # "no function or associated item named `get`" rather than anything to do with the code.
      # A stub is enough for the derive to generate, which keeps the module inside clippy's reach;
      # building the real UI here would cost minutes to lint a handful of lines.
      - name: Stub the embedded UI directory
        run: mkdir -p ../ui/build && { [ -f ../ui/build/index.html ] || echo '<!doctype html>' > ../ui/build/index.html; }

      - name: Clippy server
        run: cargo clippy --bin server --all-features -- -D warnings
      
      - name: Test server binary
        run: cargo test --lib

      # The identity predicate is generated as SQL and as Rust from one list, and only this
      # test asks a real PostgreSQL whether the two agree. Left out of `cargo test --lib` (it
      # is `#[ignore]`d because it starts a container), it guarded nothing: a coordinated edit
      # of the generator and the golden string it is checked against reintroduced a dropped
      # neighbour class with the whole suite still green. One filter per invocation, as in
      # release.yml -- cargo test takes a single TESTNAME.
      - name: Test the generated identity SQL against a real PostgreSQL
        run: cargo test --lib the_generated_sql_answers_the_table_on_a_real_postgres -- --ignored

      - name: Install squawk
        run: npm install -g squawk-cli@2.47.0

      - name: Lint migrations
        run: ./scripts/lint-migrations.sh

      - name: Build server (release)
        run: cargo build --release --bin server
